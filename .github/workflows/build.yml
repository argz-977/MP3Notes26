name: Build and (optional) Deploy NotesMP3Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown $(whoami) /opt/theos
          if [ ! -d /opt/theos/.git ]; then git clone --depth=1 https://github.com/theos/theos.git /opt/theos; fi
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          brew update || true
          brew install dpkg || true
          brew install ldid || true

      - name: Build package
        env:
          THEOS: /opt/theos
        run: |
          echo "THEOS=$THEOS"
          ls -la /opt/theos
          make package
          ls -la

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: notesmp3tweak-deb
          path: '**/*.deb'
